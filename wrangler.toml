# Cloudflare Worker with static assets: the React app is served from ./dist, /api/* runs server/worker.ts.
name = "personal-learning-os"
main = "server/worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Nightly learner-state backup at 02:00 IST.
[triggers]
crons = ["30 20 * * *", "30 14 * * *"]  # 02:00 IST backup, 20:00 IST evening nudge

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "learning-os"
database_id = "4868cae5-9b73-419d-a5f5-8191f2795d3b"
migrations_dir = "migrations"

[vars]
GITHUB_REPO = "Coderopp/personal-learning-os"
GITHUB_BRANCH = "main"
STATE_REPO = "Coderopp/learning-os-state"
# Public half of the Web Push (VAPID) key pair; the private half is the VAPID_PRIVATE_KEY secret.
VAPID_PUBLIC_KEY = "BLwHISeOEA_OSWhkrjyNoAgzKVL5voAqcamrEzkMYzJ4KmZM8B392DExzhM7HFgwAaRHsR11evsmwF_UtGUrtWI"
VAPID_SUBJECT = "https://github.com/Coderopp/personal-learning-os"
LLM_LARGE = "openai/gpt-oss-120b"
LLM_FAST = "openai/gpt-oss-20b"
