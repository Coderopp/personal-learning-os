# Cloudflare Worker with static assets: the React app is served from ./dist, /api/* runs server/worker.ts.
name = "learning-os"
main = "server/worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "learning-os"
database_id = "b34bec87-456e-4564-935d-445d6cb0fc7e"
migrations_dir = "migrations"

[vars]
GITHUB_REPO = "Coderopp/personal-learning-os"
GITHUB_BRANCH = "main"
LLM_LARGE = "openai/gpt-oss-120b"
LLM_FAST = "openai/gpt-oss-20b"
